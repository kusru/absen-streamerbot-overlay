<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Absen Overlay</title>

  <!-- untuk animasi muncul dan hilang -->
   <!-- for pop-in and pop-out animations -->
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Sora", sans-serif;
    }

    .card {
      transform: translateY(20px);
      opacity: 0;
    }

    .animate-in {
      animation: popIn 0.5s ease forwards;
    }

    .animate-out {
      animation: popOut 0.5s ease forwards;
    }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>
  <!-- Definisi bentuk wavy badge untuk pembungkus foto avatar -->
  <svg width="0" height="0" style="position:absolute">
    <defs>

  <main class="main">
    <div id="overlayCard" class="card card-container">
      <p id="title" class="title">Loading...</p>

      <div class="image-container">
        <img id="avatar" class="image" src="https://placehold.co/300x300?text=No+Image" alt="" />
      </div>

      <div class="text-container">
        <h1 id="userName" class="username-text">Loading...</h1>
        <h2 id="summary" class="summary-text">Loading...</h2>

    </div>
  </main>
